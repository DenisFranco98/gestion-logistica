<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Tu cuenta · Gestión Logística</title>
</head>
<body>
<script>
// La página vive en /cuenta/ — una URL sin extensión, más limpia para el enlace
// del correo. Esto queda como puente para cualquier enlace viejo que apunte al
// .html: se conservan mode y oobCode, que son todo lo que importa.
location.replace('/cuenta/' + (location.search || '') + (location.hash || ''));
</script>
<noscript><meta http-equiv="refresh" content="0;url=/cuenta/"></noscript>
<p>Redirigiendo a <a href="/cuenta/">/cuenta/</a>…</p>
</body>
